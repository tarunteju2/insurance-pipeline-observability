name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==================== LINT ====================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check src/ tests/ scripts/ --output-format=github

      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/

  # ==================== TEST ====================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pipeline_admin
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: insurance_lineage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: insurance_lineage
      POSTGRES_USER: pipeline_admin
      POSTGRES_PASSWORD: testpass
      APP_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ==================== SCHEMA VALIDATION ====================
  schema-check:
    name: Schema Governance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git diff

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate schemas
        run: python scripts/validate_schemas.py --strict

  # ==================== DOCKER BUILD ====================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, schema-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.airflow
          push: false
          tags: insurance-pipeline:${{ github.sha }}
          cache-from: type=gha
        strategy:
          matrix:
            python-version: ["3.9", "3.11"]
          cache-to: type=gha,mode=max

  # ==================== SECURITY SCAN ====================
  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true  # informational for now

  # ==================== INTEGRATION SMOKE ====================
  integration:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up -d --build --wait
          sleep 30

      - name: Health check
        run: |
          curl -sf http://localhost:8082/health | jq .
          curl -sf http://localhost:8082/metrics | head -20

      - name: Tear down
        if: always()
        run: docker compose down -v
